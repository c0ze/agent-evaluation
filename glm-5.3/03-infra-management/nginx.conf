worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/json;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;

  # Don't advertise the nginx version in headers or error pages.
  server_tokens off;

  # JSON API: payloads are small; reject oversized bodies early.
  client_max_body_size 1m;
  client_body_timeout 10s;
  client_header_timeout 10s;

  gzip on;
  gzip_min_length 256;
  gzip_types application/json;
  gzip_proxied any;

  # Keepalive connections to the upstream (works with proxy_set_header Connection "").
  proxy_http_version 1.1;

  server {
    listen 80;
    server_name _;

    # Timeouts tuned for a JSON API: fail fast when connecting,
    # but allow slow handlers up to 30s.
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Proxy-local health endpoint. Used by the compose healthcheck and
    # by the operator; it deliberately does NOT hit the upstream.
    location = /health {
      access_log off;
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://api:5000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
    }
  }
}
