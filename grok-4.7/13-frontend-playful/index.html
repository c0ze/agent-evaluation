<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Moss is a gentle care queue for four household plants: who is overdue, what they need, and the shape of the week.">
  <title>Moss — today’s plant care</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#queue">Skip to care queue</a>
  <noscript>
    <div class="shell noscript">
      <p class="kicker">Household plant care</p>
      <h1>Moss</h1>
      <p>The queue needs JavaScript for watered, snooze, and undo. Today’s order, most overdue first:</p>
      <ol>
        <li>Frida, Boston fern, bathroom — Water, 2 days overdue</li>
        <li>Orbit, golden pothos, bookshelf — Rotate, today</li>
        <li>Dot, bunny ears cactus, south window — Check soil, today</li>
        <li>Drama, calathea orbifolia, bedroom — Mist, tomorrow</li>
      </ol>
    </div>
  </noscript>
  <div id="app" class="shell"></div>
  <div id="toast" class="toast" role="status" aria-atomic="true" hidden></div>
  <script src="app.js"></script>
</body>
</html>
