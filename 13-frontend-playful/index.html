<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moss — Household Plant Care</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#care-queue">Skip to care queue</a>

  <div class="app-shell">
    <header class="masthead">
      <div class="brand-lockup">
        <div class="brand-seal" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="44" height="44" fill="none">
            <path d="M8 29C7 17 15 8 27 9C37 10 42 18 40 29C38 38 29 42 19 41C11 40 9 35 8 29Z" fill="#2F5E3B" stroke="#1D2A1F" stroke-width="2.2"/>
            <path d="M24 33C24 23 24 18 24 14" stroke="#F4EFE4" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M24 23C19 22 16 19 16 15C20 15 23 18 24 23Z" fill="#D9E4D2"/>
            <path d="M24 20C29 19 33 16 33 12C28 12 25 15 24 20Z" fill="#EAB84E"/>
            <circle cx="15" cy="30" r="1.6" fill="#F4EFE4"/>
            <circle cx="32" cy="31" r="1.6" fill="#F4EFE4"/>
          </svg>
        </div>
        <div class="brand-copy">
          <div class="brand-title-row">
            <h1 class="brand-name">Moss</h1>
            <span class="season-stamp">Sep 22 · Shelf check</span>
          </div>
          <p class="brand-subtitle">Quiet routines for four opinionated roommates.</p>
        </div>
      </div>

      <div class="masthead-status" id="masthead-status" aria-label="Today's care summary"></div>
    </header>

    <main class="studio-layout">
      <section class="queue-pane" id="care-queue" aria-labelledby="queue-heading">
        <div class="section-header">
          <div>
            <h2 class="section-title" id="queue-heading">Today’s Care Queue</h2>
            <p class="section-note" id="queue-subtitle">Overdue thirst goes first; tomorrow’s mist waits quietly.</p>
          </div>
          <button type="button" class="ghost-reset-btn" id="reset-btn" hidden>
            Reset day
          </button>
        </div>

        <div id="queue-content" class="queue-content"></div>
      </section>

      <aside class="companion-pane" aria-label="Weekly rhythm and plant dossier">
        <section class="rhythm-card" aria-labelledby="rhythm-heading">
          <div class="rhythm-header">
            <div>
              <h2 class="rhythm-title" id="rhythm-heading">Weekly Rhythm</h2>
              <p class="rhythm-caption" id="rhythm-caption">Loading shelf cadence…</p>
            </div>
            <div class="rhythm-total" id="rhythm-total" aria-live="polite"></div>
          </div>
          <ol class="rhythm-bars" id="rhythm-bars"></ol>
        </section>

        <section class="dossier-pane" id="desktop-dossier-pane" aria-labelledby="dossier-heading">
          <h2 class="visually-hidden" id="dossier-heading">Selected plant details</h2>
          <div id="desktop-dossier" class="dossier-card"></div>
        </section>
      </aside>
    </main>
  </div>

  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="sr-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js" defer></script>
</body>
</html>
