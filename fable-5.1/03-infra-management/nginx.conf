# Reverse proxy for the JSON API. Mounted read-only at /etc/nginx/nginx.conf.
# This is the only container that publishes a port.

worker_processes auto;
pid /var/run/nginx.pid;

# The official image links both log files to the container's stdout/stderr.
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time req_id=$request_id';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    server_tokens off;

    # JSON API: bodies are small and clients should not be able to hold
    # connections open slowly. Raise client_max_body_size if uploads are added.
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1k;

    # Resolve the api service through Docker's embedded DNS at request time (a
    # variable in proxy_pass triggers this). A recreated api container with a
    # new address then keeps working without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80 default_server;
        server_name _;

        set $api_upstream http://api:8000;

        # Headers the API needs to see the real client (Flask ProxyFix trusts one hop).
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;

        # Upstream timeouts aligned with gunicorn's 30s request timeout.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-ID $request_id always;

        # nginx-generated gateway errors answer in JSON like the API does.
        error_page 502 504 @upstream_unavailable;

        location = /healthz {
            access_log off;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
            proxy_pass $api_upstream;
        }

        location / {
            proxy_pass $api_upstream;
        }

        location @upstream_unavailable {
            default_type application/json;
            return 503 '{"error":"service unavailable"}';
        }
    }
}
