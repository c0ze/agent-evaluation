worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    default_type application/json;

    log_format json_combined escape=json
        '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    keepalive_timeout 65s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    client_max_body_size 1m;

    upstream api_backend {
        server api:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Request-ID $request_id always;

        error_page 413 = @error_413;
        error_page 502 503 504 = @error_5xx;

        location = /healthz {
            access_log off;
            return 200 '{"status":"ok","service":"proxy"}\n';
        }

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;
            proxy_buffering on;
        }

        location @error_413 {
            return 413 '{"error":"payload_too_large","message":"Request body exceeds 1MB limit."}\n';
        }

        location @error_5xx {
            return 502 '{"error":"upstream_unavailable","message":"API upstream is temporarily unavailable."}\n';
        }
    }
}
