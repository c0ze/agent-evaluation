<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moss — Gentle Plant Care</title>
  <meta name="description" content="Moss is a warm, tactile household plant-care companion for daily care queues, light and watering notes, and weekly care rhythms.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%232C5E44'/%3E%3Cpath d='M9 22c0-4.2 3.4-7 7.6-7 3.8 0 6.4 2.4 6.4 5.6 0 2.6-2 4.4-5.2 4.4h-4.4C10.8 25 9 23.8 9 22z' fill='%23E3D5BC'/%3E%3Cpath d='M16 16c0-4.5 1.2-7.5 5-8.5-.3 4.2-2 6.8-5 8.5z' fill='%23A8D2AE'/%3E%3Cpath d='M16 16c-.4-3.4-2.4-5.6-5.6-6.2.7 3.2 2.4 5.2 5.6 6.2z' fill='%23F4EEE2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#care-queue">Skip to today’s care queue</a>

  <div class="app-shell">
    <header class="masthead">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="44" height="44" fill="none">
            <path d="M8 31.5C8 24.4 14.3 19.5 23.8 19.5C33.4 19.5 40 24.1 40 30.8C40 36.2 35.1 39.5 27.6 39.5H17.8C11.9 39.5 8 36.4 8 31.5Z" fill="#DFD1B8" stroke="#1D2A22" stroke-width="2.2" stroke-linejoin="round"/>
            <circle cx="15.5" cy="31" r="1.4" fill="#9E8B70"/>
            <circle cx="21" cy="34.2" r="1.2" fill="#9E8B70"/>
            <circle cx="32.5" cy="31.8" r="1.4" fill="#9E8B70"/>
            <path d="M23.5 21.5C23.5 15.2 26.8 10.1 34.4 8.5C33.6 15.4 29.9 19.8 23.5 21.5Z" fill="#5B8C68" stroke="#1D2A22" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M23.5 21.5C22.2 15.9 18.2 12.1 12.2 11.4C13.6 16.9 17.5 20.2 23.5 21.5Z" fill="#2C5E44" stroke="#1D2A22" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M23.5 21.5V26" stroke="#1D2A22" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-copy">
          <div class="brand-title-row">
            <h1 class="brand-name">Moss</h1>
            <span class="date-stamp">Tue, Sep 22</span>
          </div>
          <p class="brand-whisper" id="header-whisper">Start with Frida — she’s been patiently waiting.</p>
        </div>
      </div>

      <div class="masthead-status">
        <div class="pebble-tracker" id="pebble-tracker" role="status" aria-live="polite">
          <!-- Populated dynamically with progress pebbles -->
        </div>
        <button type="button" class="btn-ghost-reset" id="header-reset-btn" hidden>
          Reset day
        </button>
      </div>
    </header>

    <main class="workspace" id="care-queue" tabindex="-1">
      <div class="queue-column">
        <section class="queue-section" aria-labelledby="queue-heading">
          <div class="section-intro">
            <h2 id="queue-heading" class="section-title">Today’s care queue</h2>
            <p class="section-meta" id="queue-count-label">1 overdue · 2 due today</p>
          </div>

          <div id="overdue-zone" class="queue-zone queue-zone--overdue"></div>
          <div id="today-zone" class="queue-zone queue-zone--today"></div>
          <div id="all-done-zone" class="all-done-zone" hidden></div>
        </section>

        <section id="resting-zone" class="resting-section" aria-labelledby="resting-heading">
          <!-- Populated dynamically with Tomorrow, Snoozed, and Tended today shelves -->
        </section>
      </div>

      <aside class="companion-column" aria-label="Plant specimen details and weekly rhythm">
        <section id="desktop-dossier" class="dossier-panel" aria-labelledby="dossier-plant-name" tabindex="-1">
          <!-- Populated dynamically on desktop viewports -->
        </section>

        <section id="rhythm-panel" class="rhythm-panel" aria-labelledby="rhythm-heading">
          <!-- Populated dynamically with the 7-day care rhythm -->
        </section>
      </aside>
    </main>

    <footer class="bench-footer">
      <p class="footer-note">
        <span class="footer-dot" aria-hidden="true"></span>
        <span>Tip: use <kbd>Tab</kbd> to move through your plants, or <kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>Z</kbd> to undo the last care action.</span>
      </p>
    </footer>
  </div>

  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="sr-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js"></script>
</body>
</html>
