<main id="main" tabindex="-1" class="wrap">
  <div id="today-view">
    <section class="hero" aria-labelledby="today-title">
      <div class="hero-copy">
        <div class="eyebrow hero-date"><svg class="icon" aria-hidden="true"><use href="#i-cal"/></svg><time id="today-date"></time></div>
        <h1 id="today-title">Time to <em>tend.</em></h1>
        <p id="hero-summary">A little care for your indoor garden.</p>
      </div>
      <svg class="can-art" viewBox="0 0 480 234" fill="none" aria-hidden="true">

        </defs>
        <g stroke="#364b36" stroke-linecap="round" stroke-linejoin="round">

          <g stroke-width="1.8">
            <path d="M34 204q27-5 51-2m8 1 11 1m-70 5 17-1m13 2 8-1" opacity=".55"/>

    <div class="dashboard">
      <section class="queue" aria-labelledby="queue-title">
        <div class="section-head"><h2 id="queue-title">Care queue</h2><span class="queue-count" id="queue-count"></span></div>
        <div id="queue-content"></div>
      </section>
      <aside class="side">
        <section class="rhythm" aria-labelledby="rhythm-title">
          <div class="rhythm-head"><div><h2 id="rhythm-title">Weekly rhythm</h2><p>Care tasks by day</p></div><svg class="rhythm-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-linecap="round" stroke-width="1.5"><circle cx="20" cy="20" r="8"/><path d="m20 4 .3 5m-.3 22-.3 5M4 20l5 .3m22-.3 5-.3M8.7 8.8l4 3.5m14.9 15.1 3.8 3.8M8.7 31.2l3.9-3.5m15-15.2 3.7-3.7M14 4.8l1.8 5m9.4 20.6 1.4 4.7M4.8 26.2l4.5-2m21.4-9 4.4-1.7M5 14.1l4.7 1.8m20.4 9 5 1.5M14 35l2-4.7m8-20.9 2.1-4.4"/></g></svg></div>
          <div id="week-chart"></div>
        </section>
        <section class="notes" aria-labelledby="notes-title">
          <div class="notes-head"><svg class="icon" aria-hidden="true"><use href="#i-journal"/></svg><h2 id="notes-title" class="eyebrow">Field notes</h2></div>
          <div id="note-content" aria-live="polite" aria-atomic="true"></div>
          <div class="note-controls"><button class="icon-btn" id="prev-note" aria-label="Previous field note"><svg class="icon"><use href="#i-left"/></svg></button><button class="icon-btn" id="next-note" aria-label="Next field note"><svg class="icon"><use href="#i-right"/></svg></button></div>
        </section>
      </aside>
    </div>
  </div>
  <section id="plants-view" hidden aria-labelledby="shelf-title">
    <div class="shelf-heading"><h1 id="shelf-title">My <em>plants.</em></h1><p>Four familiar faces in your indoor garden.</p></div>
    <div class="plant-grid" id="plant-grid"></div>
  </section>
</main>
<dialog id="detail" aria-labelledby="detail-name"><div id="detail-content"></div></dialog>
<div class="toast" id="toast" hidden><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span id="toast-text"></span><button id="undo" type="button" aria-keyshortcuts="Control+Z Meta+Z">Undo</button></div>
<div class="sr-only" role="status" id="announcement" aria-atomic="true"></div>
