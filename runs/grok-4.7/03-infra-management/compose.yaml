# Single-host Compose stack. Limits and restarts are local Docker settings.
# This file is not a multi-node scheduler, secret store, or rolling-upgrade system.

name: app

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    image: nginx:1.27-alpine
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: app-api:${APP_IMAGE_TAG:-local}
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    init: true
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@db:5432/${POSTGRES_DB:?required}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?required}@cache:6379/0"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-30}"
      GUNICORN_GRACEFUL_TIMEOUT: "${GUNICORN_GRACEFUL_TIMEOUT:-20}"
      GUNICORN_APP: "${GUNICORN_APP:-app:app}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-*}"
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - edge
      - data
    stop_grace_period: 25s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; raise SystemExit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3).getcode() == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  db:
    image: postgres:16-alpine
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}"
      POSTGRES_DB: "${POSTGRES_DB:?required}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-healthcheck.sh:/usr/local/bin/postgres-healthcheck.sh:ro
    expose:
      - "5432"
    networks:
      - data
    shm_size: 128mb
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/postgres-healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  cache:
    image: redis:7-alpine
    pull_policy: missing
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?required}"
      REDISCLI_AUTH: "${REDIS_PASSWORD:?required}"
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-entrypoint.sh"]
    command: ["run"]
    volumes:
      - ./redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    expose:
      - "6379"
    networks:
      - data
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  pgdata:
    name: app_pgdata
