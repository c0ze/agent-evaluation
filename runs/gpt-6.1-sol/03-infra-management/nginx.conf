# The image runs as uid 101 and listens on an unprivileged port.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    default_type application/json;
    server_tokens off;
    access_log /dev/stdout;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;

    # Docker's DNS: re-resolve after an API container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    server {
        listen 8080;
        server_name _;

        location / {
            set $api_upstream api:5000;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # nginx is the directly exposed edge; discard untrusted client headers.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header Forwarded "";

            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_request_buffering on;
            proxy_buffering on;
            proxy_next_upstream off;
        }
    }
}
