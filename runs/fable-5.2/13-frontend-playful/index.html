<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3EADA">
  <meta name="color-scheme" content="light">
  <title>Moss · today's plant care</title>
  <!-- Inline icon so the browser never asks the network for a favicon. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%23F3EADA'/%3E%3Cpath d='M5 22c0-5 3-8 6-8 1-4 4-6 7-5 3 1 4 4 3 6 4 0 6 3 6 7z' fill='%233D5C32'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#queue">Skip to today's care</a>

  <div class="app" id="app">
    <header class="masthead" id="masthead">
      <p class="brand">
        <svg class="brand__mark" viewBox="0 0 44 30" aria-hidden="true" focusable="false">
          <path d="M3 27c-2-8 3-13 8-12 0-7 6-11 11-9 3-5 11-4 12 2 5 0 8 5 6 10 3 2 3 7 1 9z" fill="currentColor"/>
          <circle cx="15" cy="20" r="1.6" fill="#F3EADA"/>
          <circle cx="24" cy="13" r="1.6" fill="#F3EADA"/>
          <circle cx="31" cy="21" r="1.6" fill="#F3EADA"/>
        </svg>
        <span class="brand__word">Moss</span>
      </p>
      <!-- Filled in by app.js -->
      <div id="greeting"></div>
    </header>

    <main class="queue" id="queue" tabindex="-1" aria-labelledby="queue-title">
      <h2 class="section-title" id="queue-title">Today's care</h2>
      <div id="queue-body">
        <noscript>
          <p class="noscript">Moss needs JavaScript to keep track of who has been watered. Please switch it on and reload.</p>
        </noscript>
      </div>
    </main>

    <section class="detail-pane" id="detail-pane" aria-label="Plant details" hidden></section>

    <aside class="rail" aria-label="This week and what's been handled">
      <section class="rhythm" id="rhythm" aria-labelledby="rhythm-title"></section>
      <section class="tray" id="tray" aria-labelledby="tray-title"></section>
      <footer class="colophon">
        <p>A demo day. Nothing is saved.</p>
        <button type="button" class="link-btn" data-action="reset" data-fk="reset">Start the day over</button>
      </footer>
    </aside>
  </div>

  <!-- Undo toast: a plain group, not a live region. Announcements go through #live below. -->
  <div class="toast" id="toast" role="group" aria-label="Last action" hidden></div>
  <p class="vh" id="live" role="status" aria-live="polite" aria-atomic="true"></p>

  <script src="app.js"></script>
</body>
</html>
