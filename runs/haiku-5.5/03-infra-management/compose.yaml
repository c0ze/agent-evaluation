# Single-host stack for local or small-server use. This is not an orchestrator:
# no rolling updates, no multi-host scheduling. Secrets come from .env (see .env.example).

# Fixed project name, so volume names do not change if the directory is renamed or copied
name: api-stack

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    image: nginx:1.28-alpine
    ports:
      # Loopback only. Change the bind address on purpose if other hosts need access.
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    # The nginx master starts as root to bind port 80, then drops to the nginx user for workers
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    logging: *default-logging

  api:
    build: .
    image: "${APP_IMAGE:-api:local}"
    # Not published to the host. Only the proxy reaches it, over the frontend network.
    expose:
      - "5000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@cache:6379/0"
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      # Expects GET /healthz to return 2xx only when the app can serve (see RUNBOOK.md)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host. Reachable only from api, on the internal backend network.
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    # SIGINT is Postgres's fast shutdown. SIGTERM waits for clients to disconnect and usually runs into the grace period.
    stop_signal: SIGINT
    stop_grace_period: 30s
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    logging: *default-logging

  cache:
    image: redis:7-alpine
    # Password required. AOF persistence goes to the redisdata volume.
    # Treated as a cache: capped at 256 MB with LRU eviction. If Redis becomes a queue or session store, revisit the eviction policy.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      # Lets redis-cli in the healthcheck authenticate without putting the password on its command line
      REDISCLI_AUTH: "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
    volumes:
      - redisdata:/data
    # Not published to the host. Reachable only from api, on the internal backend network.
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 256
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped
    logging: *default-logging

networks:
  frontend:
  backend:
    # No route outside the host. db and cache are unreachable from outside the stack.
    internal: true

volumes:
  pgdata:
  redisdata:
