name: app

# Shared logging policy: bounded on-disk logs instead of unbounded json-file growth.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # -------------------------------------------------------------------------
  # Edge: the only service published to the host.
  # -------------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,mode=1777
      - /tmp:size=16m,mode=1777
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -------------------------------------------------------------------------
  # Application: never published to the host, reachable only from `proxy`.
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: app-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      APP_MODULE: ${APP_MODULE:-app:app}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      HEALTHCHECK_PATH: ${HEALTHCHECK_PATH:-/healthz}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-app}?connect_timeout=5
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@cache:6379/0
    expose:
      - "8000"
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  # -------------------------------------------------------------------------
  # Postgres: internal network only, no published port, named volume for data.
  # -------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    shm_size: 256mb
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # -------------------------------------------------------------------------
  # Redis: cache only (no persistence), password protected, internal network.
  # -------------------------------------------------------------------------
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
      - --save
      - ""
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  # proxy <-> api. Not internal: it carries the published port.
  edge:
    driver: bridge
  # api <-> db/cache. `internal: true` blocks any egress to the host/internet.
  backend:
    driver: bridge
    internal: true

volumes:
  db-data:
