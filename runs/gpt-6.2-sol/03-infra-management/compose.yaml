x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  proxy:
    <<: *runtime
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/readyz"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64

  api:
    <<: *runtime
    image: ${API_IMAGE:-local/json-api:dev}
    pull_policy: never
    build: .
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: ${POSTGRES_DB:-app}
      DATABASE_USER: api
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_api_password
      REDIS_URL: redis://cache:6379/0
    secrets:
      - postgres_api_password
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz', timeout=7).close()"]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 64

  db:
    <<: *runtime
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
      - postgres_api_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-api-role.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    shm_size: 128m
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128

  cache:
    <<: *runtime
    image: redis:7.4-alpine
    command:
      - redis-server
      - --protected-mode
      - "no"
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    cpus: 0.5
    mem_limit: 192m
    pids_limit: 64

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:

secrets:
  postgres_admin_password:
    file: ${POSTGRES_ADMIN_PASSWORD_FILE:-./secrets/postgres_admin_password}
  postgres_api_password:
    file: ${POSTGRES_API_PASSWORD_FILE:-./secrets/postgres_api_password}
