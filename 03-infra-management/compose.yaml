name: small-api

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  proxy:
    <<: *service-defaults
    image: ${NGINX_IMAGE:-nginx:1.28.0-alpine}
    user: "101:101"
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 8s
      start_period: 10s
      retries: 3
    cpus: "0.50"
    mem_limit: 64m
    pids_limit: 64
    stop_grace_period: 35s

  api:
    <<: *service-defaults
    image: ${API_IMAGE:-small-api:local}
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13.7-slim-bookworm}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      REDIS_HOST: cache
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    expose:
      - "5000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - frontend
      - backend
    # The readiness healthcheck is defined in the Dockerfile.
    cpus: "1.0"
    mem_limit: 256m
    pids_limit: 128
    stop_grace_period: 35s

  db:
    <<: *service-defaults
    image: ${POSTGRES_IMAGE:-postgres:17.6-bookworm}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      # TCP plus an authenticated query verifies initialization and credentials.
      test:
        - CMD-SHELL
        - 'PGPASSWORD="$$POSTGRES_PASSWORD" PGCONNECT_TIMEOUT=2 PGOPTIONS="-c statement_timeout=2000" psql --host=127.0.0.1 --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB" --no-password --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --command="SELECT 1" >/dev/null'
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 256
    shm_size: 128m
    stop_grace_period: 60s

  cache:
    <<: *service-defaults
    image: ${REDIS_IMAGE:-redis:7.4.5-bookworm}
    user: "999:999"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    # Generate a private config instead of putting the password in argv.
    # Hex secrets avoid Redis config quoting ambiguity.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$REDIS_PASSWORD" in
          *[!0-9a-fA-F]*) echo 'REDIS_PASSWORD must be hexadecimal' >&2; exit 1 ;;
        esac
        if [ "$${#REDIS_PASSWORD}" -lt 32 ]; then
          echo 'REDIS_PASSWORD must contain at least 32 hexadecimal characters' >&2
          exit 1
        fi
        umask 077
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis-auth.conf
        exec redis-server /tmp/redis-auth.conf --bind 0.0.0.0 --protected-mode yes --save '' --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    read_only: true
    tmpfs:
      - /tmp:size=8m,uid=999,gid=999,mode=0700
      - /data:size=8m,uid=999,gid=999,mode=0700
    cap_drop:
      - ALL
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", 'test "$$(REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --host 127.0.0.1 --no-auth-warning ping)" = PONG']
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    cpus: "0.50"
    mem_limit: 192m
    pids_limit: 64
    stop_grace_period: 15s

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
