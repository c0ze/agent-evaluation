x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-health: &health
  interval: 15s
  timeout: 6s
  retries: 3
  start_period: 20s

services:
  proxy:
    <<: *service
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [front]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1/healthz"]
    cpus: 0.50
    mem_limit: 128m
    pids_limit: 64

  api:
    <<: *service
    image: local/small-api:${API_TAG:-dev}
    build: .
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-app}
      PGUSER: app_api
      PGPASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD in .env}
      REDIS_URL: redis://cache:6379/0
    networks: [front, data]
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      <<: *health
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; import sys; sys.exit(urlopen('http://127.0.0.1:5000/healthz', timeout=5).status != 200)"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 64

  db:
    <<: *service
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=peer"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-app.sql:ro
    networks: [data]
    healthcheck:
      <<: *health
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${API_DB_PASSWORD}" psql -X -w -h 127.0.0.1 -U app_api
          -d "$${POSTGRES_DB}" -v ON_ERROR_STOP=1 -qAtc 'SELECT 1'
      start_period: 45s
    stop_grace_period: 60s
    cpus: 1.0
    mem_limit: 512m
    shm_size: 128m
    pids_limit: 256

  cache:
    <<: *service
    image: redis:7.4.6-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    tmpfs:
      - /data:size=16m
    networks: [data]
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "redis-cli --raw ping | grep -qx PONG"]
    cpus: 0.50
    mem_limit: 128m
    pids_limit: 64

networks:
  front: {}
  data:
    internal: true

volumes:
  pgdata: {}
