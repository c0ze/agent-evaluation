worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15s;
    keepalive_requests 100;
    reset_timedout_connection on;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types application/json application/problem+json text/plain;
    gzip_vary on;

    map $uri $loggable {
        default 1;
        /healthz 0;
        /nginx-health 0;
    }

    log_format api escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"req_s":$request_time,"upstream_s":"$upstream_response_time","req_id":"$request_id"}';
    access_log /var/log/nginx/access.log api if=$loggable;

    # Docker's embedded DNS. A variable proxy_pass re-resolves the API after recreate.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # =CODE is the client status. Named locations return 200 so error_page does not recurse.
        error_page 413 =413 @body_too_large;
        error_page 502 =502 @upstream_down;
        error_page 504 =504 @upstream_timeout;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            set $api_host api;
            proxy_pass http://$api_host:5000;
            proxy_http_version 1.1;
            proxy_redirect off;
            proxy_next_upstream off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Powered-By;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_buffering on;
            proxy_request_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
        }

        location @body_too_large {
            default_type application/json;
            return 200 '{"error":"request body exceeds 1m limit"}';
        }

        location @upstream_down {
            default_type application/json;
            return 200 '{"error":"api unavailable"}';
        }

        location @upstream_timeout {
            default_type application/json;
            return 200 '{"error":"api timeout"}';
        }
    }
}
