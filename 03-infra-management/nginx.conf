user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    # Docker's embedded DNS. The upstream is referenced through a variable in
    # proxy_pass so nginx re-resolves "api" at runtime (TTL-aware) instead of
    # caching one container IP at boot. This survives `compose up -d api`
    # recreations and avoids nginx failing to start while api is still down.
    resolver  127.0.0.11  valid=10s  ipv6=off;

    # JSON API: reject oversized uploads early.
    client_max_body_size  1m;

    gzip             on;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_types       application/json text/plain text/css application/javascript;

    server {
        listen      80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        DENY    always;

        # Liveness of the proxy itself (used by the compose healthcheck).
        location = /nginx-health {
            access_log   off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Everything else (including the app's /healthz, for end-to-end
        # checks) is proxied to the API.
        location / {
            set $api_upstream http://api:8000;

            proxy_pass         $api_upstream;
            proxy_http_version 1.1;

            # Trustworthy client identity / scheme for the app behind us.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Connection        "";

            # Timeouts sized for a JSON API: fast connect, bounded read/send
            # so a hung worker can't pin a connection indefinitely.
            proxy_connect_timeout  5s;
            proxy_send_timeout     30s;
            proxy_read_timeout     30s;
        }
    }
}
