worker_processes auto;
pid /tmp/nginx.pid;                 # container root fs is read-only; /tmp is tmpfs
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  default_type application/json;

  log_format main '$remote_addr "$request" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time rid=$request_id';
  access_log /dev/stdout main;

  # Slow-client and body limits. Adjust client_max_body_size to the largest
  # legitimate JSON payload.
  client_max_body_size 1m;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  keepalive_timeout 30s;

  # Docker's embedded DNS. Re-resolving api:8000 (via the variable below) means a
  # recreated api container is picked up without reloading nginx, and nginx can
  # start even if api is briefly absent.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80 default_server;
    server_name _;

    set $api_upstream http://api:8000;

    # Set here (not in locations) so the error location inherits them.
    add_header X-Request-ID $request_id always;
    add_header X-Content-Type-Options nosniff always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # This nginx is the first hop, so overwrite instead of appending a
    # client-supplied X-Forwarded-For (prevents spoofing). If another proxy or
    # load balancer sits in front, switch to the realip module instead.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    # Tuned for a JSON API behind gunicorn (--timeout 30): fail fast on connect,
    # and read timeout just above the worker timeout so gunicorn reports its
    # own failure before nginx gives up.
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    35s;
    proxy_next_upstream   off;      # never replay a possibly non-idempotent request

    error_page 502 503 504 = @upstream_unavailable;

    location = /healthz {
      access_log off;               # probes every few seconds; keep logs useful
      proxy_pass $api_upstream;
    }

    location / {
      proxy_pass $api_upstream;
    }

    location @upstream_unavailable {
      internal;
      default_type application/json;
      return 503 '{"error":"service_unavailable"}\n';
    }
  }
}
