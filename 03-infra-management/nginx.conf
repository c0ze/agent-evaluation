user              nginx;
worker_processes  auto;
pid               /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept       on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    log_format json_api escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$request_id","method":"$request_method","uri":"$request_uri","status":$status,"request_time":$request_time,"upstream_time":"$upstream_response_time","body_bytes":$body_bytes_sent,"user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_api;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout 15s;

    # JSON API: small request bodies, tight client limits.
    client_max_body_size   1m;
    client_body_timeout    10s;
    client_header_timeout  10s;
    send_timeout           30s;
    client_body_buffer_size 16k;

    gzip              on;
    gzip_proxied      any;
    gzip_min_length   256;
    gzip_types        application/json application/problem+json text/plain;

    limit_req_zone  $binary_remote_addr zone=api_ratelimit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=api_connlimit:10m;

    upstream api_upstream {
        server api:8000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Liveness of the proxy itself; does not touch the API.
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            limit_req  zone=api_ratelimit burst=40 nodelay;
            limit_conn zone=api_connlimit 20;

            proxy_pass         http://api_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Request-ID      $request_id;
            proxy_set_header Connection        "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
            proxy_buffering       on;
            proxy_next_upstream   error timeout http_502;

            add_header X-Content-Type-Options nosniff   always;
            add_header X-Frame-Options        DENY      always;
            add_header Referrer-Policy        no-referrer always;
        }
    }
}
