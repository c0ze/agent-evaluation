<!doctype html><html><head><meta charset="utf-8"><title>focus</title>
<style>html,body{margin:0}iframe{width:1280px;height:820px;border:0}</style></head>
<body><iframe id="f" src="index.html"></iframe><pre id="out">p</pre>
<script>
document.getElementById('f').addEventListener('load', function(){
  var w=document.getElementById('f').contentWindow, d=w.document;
  setTimeout(function(){
    var o=[];
    // 1. Does the parsed stylesheet actually carry a :focus-visible outline rule?
    var found=null;
    for (var i=0;i<d.styleSheets.length;i++){
      var rules=d.styleSheets[i].cssRules;
      for (var j=0;j<rules.length;j++){
        if (rules[j].selectorText && rules[j].selectorText.indexOf(':focus-visible')>-1 && /outline/.test(rules[j].style.outline||'')){
          found=rules[j].selectorText+' { outline: '+rules[j].style.outline+'; }';
        }
      }
    }
    o.push('focus-visible_rule='+(found||'NOT FOUND'));
    // 2. Tab order: which elements are focusable, in DOM order?
    var f=[].slice.call(d.querySelectorAll('a[href],button,input,select,[tabindex]:not([tabindex="-1"])'));
    o.push('focusable_count='+f.length);
    o.push('order='+f.slice(0,14).map(function(n){return n.tagName.toLowerCase()+(n.id?'#'+n.id:'')+(n.className&&typeof n.className==='string'?'.'+n.className.trim().split(/\s+/)[0]:'');}).join(' > '));
    // 3. Row buttons are real buttons with accessible names
    var rb=d.querySelectorAll('.incident__btn');
    o.push('row_buttons='+rb.length);
    o.push('row0_aria="'+rb[0].getAttribute('aria-label')+'"');
    // 4. Focus one and confirm it becomes activeElement
    rb[1].focus();
    o.push('activeElement_after_focus='+(d.activeElement.className||d.activeElement.tagName));
    // 5. keyboard roving: ArrowDown from row 1
    var ev=new w.KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true});
    d.activeElement.dispatchEvent(ev);
    o.push('after_ArrowDown_active='+(d.activeElement.className||d.activeElement.tagName)+' selected_row='+(d.querySelector('.detail__id')||{}).textContent);
    // 6. Escape clears a search term
    var s=d.getElementById('global-search'); s.value='low'; s.focus();
    d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
    o.push('after_escape_search="'+s.value+'"');
    // 7. Accessible chart summary + hidden data table
    o.push('chart_aria="'+d.querySelector('#chart svg').getAttribute('aria-label').slice(0,70)+'..."');
    o.push('chart_hidden_table_rows='+d.querySelectorAll('#chart table tr').length);
    o.push('chart_bars_have_title='+d.querySelectorAll('.bar--group title').length);
    // 8. skip link
    o.push('skip_link='+(d.querySelector('.skip-link')?d.querySelector('.skip-link').getAttribute('href'):'none'));
    // 9. live region exists
    o.push('live_region='+d.getElementById('live-region').getAttribute('aria-live'));
    document.getElementById('out').textContent=o.join('\n');
    // visual focus ring: mirror the real declaration onto :focus for capture
    var st=d.createElement('style');
    st.textContent='.incident__btn:focus{outline:2px solid #4c9bf0;outline-offset:2px;border-radius:3px}';
    d.head.appendChild(st);
    rb[0].focus();
  },600);
});
</script></body></html>
