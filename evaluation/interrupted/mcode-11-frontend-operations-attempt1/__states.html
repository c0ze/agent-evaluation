<!doctype html><html><head><meta charset="utf-8"><title>states</title>
<style>html,body{margin:0;background:#0d1014}iframe{width:1280px;height:1150px;border:0}</style></head>
<body><iframe id="f" src="index.html"></iframe><pre id="out" style="color:#9aa6b4;font:12px monospace">p</pre>
<script>
var q = new URLSearchParams(location.search);
document.getElementById('f').addEventListener('load', function(){
  var w=document.getElementById('f').contentWindow, d=w.document;
  setTimeout(function(){
    var o=[];
    if (q.get('ack')) { d.querySelector('[data-ack]').click(); }
    if (q.get('empty')) { d.querySelector('.chip[data-severity="critical"]').click();
      var s=d.getElementById('status-select'); s.value='monitoring'; s.dispatchEvent(new w.Event('change',{bubbles:true})); }
    if (q.get('focus')) { d.querySelectorAll('.incident__btn')[0].focus();
      var st=d.createElement('style'); st.textContent='.incident__btn:focus{outline:2px solid #4c9bf0;outline-offset:2px;border-radius:3px}'; d.head.appendChild(st); }
    // live region checked AFTER the announce() delay
    setTimeout(function(){
      if (q.get('live')) {
        d.querySelectorAll('.incident__btn')[1].click();
        setTimeout(function(){
          o.push('live_after_select="'+d.getElementById('live-region').textContent+'"');
          o.push('pass='+(d.getElementById('live-region').textContent.indexOf('INC-2839')>-1));
          document.getElementById('out').textContent=o.join('\n');
        }, 150);
      } else { document.getElementById('out').textContent='state rendered'; }
    }, 200);
  },600);
});
</script></body></html>
