  <a class="skip-link" href="#main">Skip to plant care</a>

    <div class="dashboard">
      <section class="care" aria-labelledby="care-title">
        <div class="section-heading">
          <h2 id="care-title" tabindex="-1">Today’s care</h2>
          <span class="queue-count" id="queue-count"></span>
        </div>
        <div class="toast" id="toast" hidden>
          <svg class="icon toast-icon" aria-hidden="true"><use id="toast-icon" href="#i-check"/></svg>
          <span id="toast-message"></span>
          <button type="button" id="undo">Undo</button>
        </div>
        <div id="queue"></div>
        <noscript><p>Turn on JavaScript to see your plants and record their care.</p></noscript>
      </section>

      <aside class="rhythm" aria-labelledby="rhythm-title">
        <div class="rhythm-heading">
          <svg class="rhythm-stamp" viewBox="0 0 48 48" aria-hidden="true">
            <path d="M23 3c-7 2-7 4-12 5-3 1-3 6-6 9-3 4 0 7 0 11s4 5 6 9c2 5 7 3 11 6 4 3 7-2 11-3 5 0 5-5 8-8 4-3 2-7 2-11 1-5-4-7-6-11-3-4-7-3-10-6-1-1-3-2-4-1Z" fill="#f6efcc"/>

          </svg>
          <h2 id="rhythm-title">Weekly rhythm</h2>
          <p>Typical care tasks by day</p>
        </div>
        <ol class="week" id="week" role="list" aria-label="Typical weekly care tasks"></ol>
        <div class="rhythm-footer">
          <span><span class="legend-dot" aria-hidden="true"></span> Today</span>
          <span id="weekly-total"></span>
        </div>
      </aside>
    </div>
  </main>

  <div id="announcement" class="sr-only" role="status" aria-atomic="true"></div>

</html>
