# Single-host deployment: nginx -> gunicorn/Flask API -> Postgres + Redis.
# All secrets come from .env (copy .env.example); nothing sensitive is inlined.
# Compose is not an orchestrator: it gives you restart, health and log settings
# on one host. Multi-node scheduling is out of scope (see RUNBOOK.md).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  proxy:
    image: nginx:1.29
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Read-only bind mount: the container never needs to rewrite its config.
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
    # service_started, not service_healthy: nginx must come up even if the API
    # is briefly unavailable (docker's embedded DNS resolver lets nginx learn
    # the api address at request time). Use `docker compose ps` / the api
    # healthcheck to see readiness; until then nginx answers 502.
    depends_on:
      api:
        condition: service_started
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Port 80 is privileged, and nginx's master still needs the three
      # setuid/setgid/chown caps to spawn workers as the nginx user.
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s # matches gunicorn graceful_timeout
    expose:
      - "5000" # reachable only on the frontend network, never published
    environment:
      # ${VAR:?} makes compose fail loudly if .env is missing a value.
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@cache:6379/0
      WEB_CONCURRENCY: "4"
      LOG_LEVEL: info
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    # Readiness: 200 only when Postgres *and* Redis answer, so the status here
    # is a real signal, not just "the process is alive".
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Immutable container filesystem; gunicorn uses /tmp for worker heartbeats.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
          pids: 200
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${POSTGRES_USER:?set POSTGRES_USER in .env}",
          "-d",
          "${POSTGRES_DB:?set POSTGRES_DB in .env}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s # first boot runs initdb
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1G
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    # NOT published to the host. For a one-off local shell use
    # `docker compose exec db psql ...` (see RUNBOOK.md) instead of exposing it.
    # ports:
    #   - "127.0.0.1:5432:5432"   # loopback-only, temporary debugging only

  cache:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "no", "--save", ""]
    environment:
      # Lets `redis-cli` in the healthcheck authenticate without -a on the CLI.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Cache only: no persistence, so no volume. Anything that must survive a
    # restart belongs in Postgres.
    # ports:
    #   - "127.0.0.1:6379:6379"   # loopback-only, temporary debugging only

networks:
  # Public-facing hop: proxy <-> api.
  frontend:
  # Data plane: api <-> db/cache. db and cache are not on the frontend network.
  backend:
    internal: true

volumes:
  pgdata:
