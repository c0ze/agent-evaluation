worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Sane defaults for a small reverse proxy.
  sendfile on;
  tcp_nopush on;
  server_tokens off;

  # JSON request bodies should stay bounded.
  client_max_body_size 1m;

  upstream api {
    server api:8000;
    keepalive 32;
  }

  server {
    listen 80;

    # Lightweight liveness endpoint for health checks (no upstream hit).
    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      # Forward the real client information to the API.
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Timeouts appropriate for a JSON API: fail fast instead of hanging.
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 30s;
    }
  }
}
