# Reverse proxy for the JSON API. nginx is the edge: it terminates client
# connections and forwards to gunicorn on the private "edge" network.
# TLS is expected to be terminated here or by an upstream load balancer;
# add a 443 server block (and HSTS) when certificates are available.

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/json;

  server_tokens off;
  sendfile on;
  tcp_nopush on;

  # Structured access log with request id and upstream timing.
  log_format json_combined escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';
  access_log /dev/stdout json_combined;

  # Client-side limits and timeouts sized for small JSON requests.
  client_max_body_size 1m;
  client_body_buffer_size 64k;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  keepalive_timeout 30s;

  gzip on;
  gzip_types application/json application/problem+json;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;

  # Docker's embedded DNS. Re-resolving "api" means a recreated API container
  # (new IP) is picked up without restarting nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  upstream api_backend {
    zone api_backend 64k;
    server api:8000 resolve;
    keepalive 16;
    keepalive_timeout 60s;
  }

  server {
    listen 80 default_server;
    server_name _;

    # nginx's own liveness endpoint (used by the compose healthcheck).
    location = /nginx-health {
      access_log off;
      return 200 '{"status":"ok"}\n';
    }

    location / {
      proxy_pass http://api_backend;

      # HTTP/1.1 + empty Connection header enables upstream keepalive.
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      # nginx is the edge: overwrite (not append) client-supplied values so
      # X-Forwarded-For cannot be spoofed. If another proxy/LB sits in front,
      # configure ngx_http_realip_module and switch to $proxy_add_x_forwarded_for.
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;

      # Upstream timeouts. Read timeout is slightly above gunicorn's 30s
      # worker timeout so the app, not the proxy, decides when a request dies.
      proxy_connect_timeout 5s;
      proxy_send_timeout 35s;
      proxy_read_timeout 35s;

      # Do not replay requests (e.g. POSTs) against the single upstream.
      proxy_next_upstream off;

      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;

      proxy_hide_header X-Powered-By;

      add_header X-Request-ID $request_id always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # Return JSON (not nginx HTML) when the API is down or times out.
    # Application-generated 5xx responses pass through unchanged.
    error_page 502 503 504 @upstream_unavailable;
    location @upstream_unavailable {
      default_type application/json;
      add_header X-Request-ID $request_id always;
      return 503 '{"error":"service_unavailable","request_id":"$request_id"}\n';
    }
  }
}
