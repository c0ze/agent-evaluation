# Full main configuration: this file replaces /etc/nginx/nginx.conf, so it must
# declare the main-context directives the stock file provides.
#
# Runs on nginxinc/nginx-unprivileged (uid 101, listens on 8080): no master
# process as root, no CAP_NET_BIND_SERVICE needed, and the container can run
# with a read-only root filesystem.

worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr  warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;   # JSON API: sane default for generated bodies

    # Writable locations for an unprivileged user on a read-only rootfs.
    client_body_temp_path  /tmp/nginx-client;
    proxy_temp_path        /tmp/nginx-proxy;
    fastcgi_temp_path      /tmp/nginx-fastcgi;
    uwsgi_temp_path        /tmp/nginx-uwsgi;
    scgi_temp_path         /tmp/nginx-scgi;

    # ---- logging ----------------------------------------------------------
    # Structured access logs to stdout so `docker compose logs` and any log
    # shipper get parseable records; request_id ties proxy and API logs together.
    log_format json_access escape=json
        '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"query":"$args",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
        '}';
    access_log  /dev/stdout  json_access;

    # ---- general ----------------------------------------------------------
    server_tokens        off;          # do not advertise the nginx version
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;
    keepalive_timeout    65s;
    keepalive_requests   1000;
    reset_timedout_connection on;

    # A JSON API does not accept uploads; cap the body and the time a client
    # may take to send it (slowloris).
    client_max_body_size    1m;
    client_body_timeout     10s;
    client_header_timeout   10s;
    send_timeout            30s;
    client_body_buffer_size 16k;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        application/json application/problem+json text/plain;

    # ---- abuse limits -----------------------------------------------------
    # Per-client budget, generous enough for normal API use. Tune from real
    # traffic; these are defaults, not a substitute for an edge WAF.
    limit_req_zone   $binary_remote_addr  zone=api_rate:10m  rate=20r/s;
    limit_conn_zone  $binary_remote_addr  zone=api_conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ---- upstream ---------------------------------------------------------
    upstream api_backend {
        # Resolved once at startup. After `docker compose up -d --force-recreate
        # api` the container IP can change, so restart the proxy too (RUNBOOK).
        server api:8000  max_fails=3  fail_timeout=10s;

        # Connection pool to gunicorn; requires HTTP/1.1 + empty Connection
        # header below. gunicorn's keepalive (75s) is deliberately longer.
        keepalive             32;
        keepalive_timeout     60s;
        keepalive_requests    1000;
    }

    server {
        listen       8080;
        server_name  _;

        # Baseline response headers for an API (no cookies, no framing).
        add_header X-Content-Type-Options  "nosniff"        always;
        add_header X-Frame-Options         "DENY"           always;
        add_header Referrer-Policy         "no-referrer"    always;
        add_header X-Request-Id            $request_id      always;

        # Proxy behaviour shared by every proxied location.
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwritten, not appended: with no trusted L7 hop in front of nginx,
        # a client-supplied X-Forwarded-For chain would be forgeable. If a real
        # load balancer is added, configure set_real_ip_from/real_ip_header and
        # switch this to $proxy_add_x_forwarded_for.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Request-Id      $request_id;

        # Small JSON payloads: fail fast on connect, allow a normal request to
        # finish, and stay under gunicorn's 30s worker timeout so a stuck
        # request surfaces as a 504 here rather than a killed worker there.
        proxy_connect_timeout  5s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;

        # Retry only when the request was provably not processed.
        proxy_next_upstream          error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries    2;
        proxy_next_upstream_timeout  10s;

        proxy_buffering          on;
        proxy_buffers            8 16k;
        proxy_buffer_size        16k;
        proxy_busy_buffers_size  32k;
        proxy_redirect           off;

        # nginx's own liveness, answered without touching the API. Used by the
        # proxy container healthcheck.
        location = /nginx-health {
            access_log off;
            return 200 '{"status":"ok","component":"proxy"}';
        }

        # Application health: proxied, but never rate limited or logged so a
        # probe loop cannot exhaust the client budget or flood the logs.
        location = /healthz {
            access_log off;
            proxy_pass http://api_backend;
        }

        location / {
            limit_req   zone=api_rate burst=40 nodelay;
            limit_conn  api_conn 32;
            proxy_pass  http://api_backend;
        }

        # Always answer with JSON, including nginx-generated errors.
        error_page 429 = @rate_limited;
        error_page 502 = @upstream_error;
        error_page 503 = @upstream_unavailable;
        error_page 504 = @upstream_timeout;

        location @rate_limited {
            return 429 '{"error":"rate_limited","request_id":"$request_id"}';
        }
        location @upstream_error {
            return 502 '{"error":"bad_gateway","request_id":"$request_id"}';
        }
        location @upstream_unavailable {
            return 503 '{"error":"service_unavailable","request_id":"$request_id"}';
        }
        location @upstream_timeout {
            return 504 '{"error":"gateway_timeout","request_id":"$request_id"}';
        }
    }
}
