[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slugkit"
version = "0.4.0"
description = "Small slug and version helpers"
requires-python = ">=3.10,<3.14"
dependencies = ["packaging>=22"]

[tool.ruff]
target-version = "py310"
line-length = 100
